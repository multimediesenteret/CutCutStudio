name: ui

# Lint, types, tests and build for the screens (ui/). Runs only when UI-related files change,
# to save Actions minutes on the free plan (D-050). Linux only: the UI is static files.
# Also runs when the parts of the engine the screens talk to change (API, studio, session, sim),
# and for the Node bridges (bridges/), which share the pnpm workspace.

# Not on push to main: the PR was tested on top of main (D-059). Vercel builds on its own.
on:
  pull_request:
    paths:
      - "ui/**"
      - "bridges/**"
      - "tests/fixtures/atem/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - "docs/reference/openapi.json"
      - "src/cutcut/api/**"
      - "src/cutcut/app/**"
      - "src/cutcut/session/**"
      - "src/cutcut/sim/**"
      - ".github/workflows/ui.yml"
      - "concept/**"
      - "vercel.json"
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API types match docs/reference/openapi.json
        run: pnpm types:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: What Vercel publishes
        run: node ui/scripts/vercel-out.mjs
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Screens served by the simulator (README command, SIM-6)
        run: uv run cutcut sim --smoke
      - name: Touch flow end to end against the simulator (U-5)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
