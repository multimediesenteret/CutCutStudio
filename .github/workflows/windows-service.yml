name: windows-service

# SO-2: installs the real Windows service with WinSW on a Windows runner and checks that it
# comes up, restarts a killed core, and leaves nothing behind when stopped. Runs only when the
# installer or the supervisor change (Windows minutes cost more, D-050).

on:
  pull_request:
    paths:
      - "src/cutcut/common/bus/**"
      - "src/cutcut/app/core.py"
      - "src/cutcut/audio/main.py"
      - "installer/**"
      - "src/cutcut/supervisor/**"
      - "src/cutcut/api/**"
      - ".github/workflows/windows-service.yml"
  push:
    branches: [main]
    paths:
      - "src/cutcut/common/bus/**"
      - "src/cutcut/app/core.py"
      - "src/cutcut/audio/main.py"
      - "installer/**"
      - "src/cutcut/supervisor/**"
      - "src/cutcut/api/**"
      - ".github/workflows/windows-service.yml"
  workflow_dispatch:

concurrency:
  group: windows-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install the CutCut service
        shell: pwsh
        run: |
          .\installer\install-services.ps1 -Root "$env:RUNNER_TEMP\CutCut" -App "$env:GITHUB_WORKSPACE" -Site "$env:GITHUB_WORKSPACE\site\example" -Port 8090
          Get-Service CutCut | Format-List Name, Status, StartType
          if ((Get-Service CutCut).StartType -ne "Automatic") { throw "Tjenesten starter ikke automatisk" }
      - name: Comes up, and a killed core comes back
        shell: pwsh
        run: |
          function Wait-Health([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:8090/api/health" -TimeoutSec 2
                if ($h.runtime.processes | Where-Object { $_.name -eq "core" -and $_.running }) { return $h }
              } catch { }
              Start-Sleep -Seconds 1
            }
            throw "core svarte ikke innen $seconds s"
          }
          function Get-Core {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*-m cutcut core*" }
          }
          $h = Wait-Health 120
          $h.runtime.processes | Format-Table name, running, uptime_s, restarts_10min
          # A venv python.exe on Windows is a launcher plus the real interpreter: kill both,
          # like a crash would.
          $core = @(Get-Core)
          if ($core.Count -lt 1) { throw "fant ingen core" }
          $core | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          $h = Wait-Health 60
          $c = $h.runtime.processes | Where-Object { $_.name -eq "core" }
          if ($c.restarts_10min -lt 1) { throw "supervisor meldte ikke omstarten" }
          Write-Host "core startet på nytt etter drap ($($c.restarts_10min) omstart)"
      - name: PowerShell scripts parse, and the kiosk guard decides right (dry run)
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Recurse installer -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" }; throw "syntaksfeil i $($f.Name)" }
          }
          $hb = Invoke-RestMethod -Uri "http://127.0.0.1:8090/api/touch/heartbeat"
          if ($null -ne $hb.age_ms) { throw "ingen touch-skjerm skulle ha meldt seg" }
          $out = & .\installer\kiosk\kiosk-vakt.ps1 -Api "http://127.0.0.1:8090" -Url "http://127.0.0.1:8090/touch/" -Once -DryRun -Edge "C:\finnes-ikke\msedge.exe" *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "ville startet Edge") { throw "vakten ville ikke startet Edge" }
          & .\installer\kiosk\setup-kiosk.ps1 -DryRun
          # The studio PC runs Windows PowerShell 5.1, which reads files without a BOM as ANSI.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\installer\kiosk\setup-kiosk.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "setup-kiosk.ps1 feiler i Windows PowerShell 5.1" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\installer\install-services.ps1 -DryRun -Root "$env:RUNNER_TEMP\CutCut2"
          if ($LASTEXITCODE -ne 0) { throw "install-services.ps1 feiler i Windows PowerShell 5.1" }
      - name: Windows setup (9.2) - check, fix, check again
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\hwtest"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\installer\setup-pc.ps1 -Out $out
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\installer\setup-pc.ps1 -Fix -Out $out -VersionsYaml "$env:RUNNER_TEMP\versions.yaml"
          $json = Get-ChildItem $out -Filter *-windows.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $r = Get-Content $json.FullName -Raw | ConvertFrom-Json
          $r.steps | Format-Table id, title, result, summary -AutoSize | Out-String -Width 200 | Write-Host
          $md = Get-ChildItem $out -Filter *-windows.md | Sort-Object LastWriteTime | Select-Object -Last 1
          Write-Host "::notice title=setup-pc::$((Get-Content $md.FullName) -join '%0A')"
          foreach ($id in "P1", "P3", "P4", "P5", "P7") {
            $s = $r.steps | Where-Object { $_.id -eq $id }
            if ($s.result -ne "ok") { throw "$id er ikke grønn etter -Fix: $($s.summary)" }
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\versions.yaml")) { throw "versions.yaml ble ikke skrevet" }
          $global:LASTEXITCODE = 0
      - name: Stopping the service leaves no process behind
        shell: pwsh
        run: |
          Stop-Service CutCut
          Start-Sleep -Seconds 5
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*-m cutcut*" }
          if ($left) { $left | Format-Table ProcessId, CommandLine; throw "prosesser ble igjen" }
          .\installer\install-services.ps1 -Root "$env:RUNNER_TEMP\CutCut" -Uninstall
          if (Get-Service CutCut -ErrorAction SilentlyContinue) { throw "tjenesten ble ikke fjernet" }
      - name: Service logs
        if: always()
        shell: pwsh
        run: |
          # Shown as annotations too, so they can be read without downloading the job log.
          $files = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\CutCut\data\logs" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $tail = (Get-Content $f.FullName -Tail 40 -ErrorAction SilentlyContinue) -join "%0A"
            Write-Host "== $($f.FullName)"
            Write-Host "::warning title=$($f.Name)::$tail"
          }
          Get-Service CutCut -ErrorAction SilentlyContinue | Format-List Name, Status
          $procs = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*cutcut*" -or $_.CommandLine -like "*main.ts*" }
          $list = ($procs | ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" }) -join "%0A"
          Write-Host "::warning title=processes::$list"
          try {
            $h = Invoke-RestMethod -Uri "http://127.0.0.1:8090/api/health" -TimeoutSec 3
            Write-Host "::warning title=health::$(($h | ConvertTo-Json -Depth 6 -Compress).Substring(0, [Math]::Min(3000, ($h | ConvertTo-Json -Depth 6 -Compress).Length)))"
          } catch { Write-Host "::warning title=health::$($_.Exception.Message)" }
