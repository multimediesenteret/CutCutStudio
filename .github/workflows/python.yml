name: python

# Lint, types and tests for the Python code. Runs only when Python-related files change,
# to save Actions minutes on the free plan (docs/plans/milestones.md, D-050).
# Linux on every PR; Windows weekly and on demand (Windows minutes cost more).

# Not on push to main: every PR is rebased on main and tested before it is merged (CI budget, D-059).
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "sim/**"
      - "config/**"
      - "site/**"
      - "tools/**"
      - "docs/reference/**"
      - "pyproject.toml"
      - "uv.lock"
      - "models/manifest.yaml"
      - ".python-version"
      - ".github/workflows/python.yml"
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra silero
      - name: Model files (Silero VAD), checked against SHA-256
        run: uv run python tools/fetch_models.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra silero
      - run: uv run python tools/fetch_models.py
      - run: uv run pytest
