  - "Innganger: navn **C1**–**C4**, **BIRD**, **LAPTOP**, **C7** (eller trykk «Fiks for meg»)."
  - "HDMI ut 2: **Multiview**. Layout og ruter som under **Multiview** på oppsettsiden."
  - "Mediaspiller 1: «Kun lyd»-grafikken. Mediaspiller 2: bakgrunnen."
  - "Sett inn disken for ISO-opptak hvis show-typen tar opp ISO."
  - "Trykk **Lagre ATEM som fasit** når alt stemmer."
