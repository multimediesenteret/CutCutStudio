schema_version: 1
number: 2
id: pc
title: "PC og Windows"
why: "Strømsparing og oppdateringer midt i et opptak er den vanligste grunnen til at en studio-PC stopper."
how:
  - "Strøm: PC, ATEM, RØDECaster og studio-switchen på **UPS**. BIOS: **slå på etter strømbrudd**."
  - "Installer **NVIDIA-driveren** og **Companion** på denne PC-en. INOGENI trenger ingen driver; sett den i en **USB 3-port rett på hovedkortet**. Brukes ATEM-ens webkamera-utgang i stedet (steg 6), går USB-C-kabelen fra ATEM-en til en slik port."
  - "Strømplan: **Høy ytelse**, skjerm og disk slås aldri av."
  - "Enhetsbehandling → USB-rotnav: fjern haken for **La datamaskinen slå av denne enheten**."
  - "Windows Update → Aktive timer: **07:00–23:00**."
  - "Tid: synkroniser mot **NTP** (samme tid som Pearl)."
  - "Noter driverversjonene for NVIDIA, RØDECaster ASIO, og capture-enheten (INOGENI, eller ATEM-firmware ved webkamera-utgang). **Ikke oppdater** dem midt i et semester uten å kjøre veiviseren på nytt."
checks: ["H-PC-*", "H-PROC-*"]
