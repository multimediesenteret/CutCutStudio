[project]
name = "cutcut"
version = "0.1.0.dev0"
description = "CutCut Studio – live auto-regi for videopodcast (NTNU Multimediesenteret)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "NTNU Multimediesenteret", email = "magnus.lian@ntnu.no" }]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "numpy>=2.1,<3",
    "psutil>=6,<8",
    "pydantic>=2.9,<3",
    "pyzmq>=26,<28",
    "ruamel-yaml>=0.18,<0.19",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
# Silero VAD for audio-capture in the studio (docs/plans/audio.md). Without it the energy VAD
# is used, which is what the tests and the simulator run on.
silero = ["onnxruntime>=1.20,<2"]

[project.scripts]
cutcut = "cutcut.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-psutil>=7.2.2.20260906",
    "onnxruntime>=1.20,<2",  # same as the «silero» extra, so tests run the studio VAD
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutcut"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "concept", "site"]  # Markdown code samples are illustrations, not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Norwegian letters in UI strings and comments are intentional

[tool.ruff.lint.isort]
known-first-party = ["cutcut"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]  # N802: rule IDs (T2, K1 …) stay uppercase in test names (spec 12.1)

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
# Tests check state after method calls; mypy's narrowing does not see that the call changed it.
module = "tests.*"
disable_error_code = ["comparison-overlap"]
