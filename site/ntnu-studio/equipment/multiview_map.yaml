# Rutekart for multiviewen i NTNU-studioet (spesifikasjonen 6.1, plan vision.md).
# STATUS: UTKAST fra bilde av multiview-skjermen 2026-10-21 (D-053). Ikke bekreftet mot
# ATEM-oppsettet; videolaget (M3) bruker det ikke før Q37 og Q38 er besvart.
#
# Mikser: ATEM Television Studio HD8 ISO. Layout: 2 store + 8 små ruter, preview til venstre.
# Koordinater er andel av bildet (0–1): x, y, bredde, høyde. Hver rute kuttes 4 % inn på
# alle sider før analyse (tally-ramme og navneskilt).
schema_version: 1
status: draft
source: "Foto av multiview, 2026-10-21"
switcher: "ATEM Television Studio HD8 ISO"
layout: "2+8, preview venstre"
tiles:
  - { id: PVW, label: "Preview", rect: [0.00, 0.00, 0.50, 0.50], source: preview }
  - { id: PGM, label: "Program", rect: [0.50, 0.00, 0.50, 0.50], source: program }
  - { id: W1, label: "Camera 1", rect: [0.00, 0.50, 0.25, 0.25], source: input1 }
  - { id: W2, label: "Camera 2", rect: [0.25, 0.50, 0.25, 0.25], source: input2 }
  - { id: W3, label: "Camera 3", rect: [0.50, 0.50, 0.25, 0.25], source: input3 }
  - { id: W4, label: "Camera 4", rect: [0.75, 0.50, 0.25, 0.25], source: input4 }
  - { id: W5, label: "Camera 6", rect: [0.00, 0.75, 0.25, 0.25], source: input6 }
  - { id: W6, label: "Camera 7", rect: [0.25, 0.75, 0.25, 0.25], source: input7 } # svart på bildet
  - { id: W7, label: "Media Player 1", rect: [0.50, 0.75, 0.25, 0.25], source: mediaplayer1 }
  - { id: W8, label: "Opptaksstatus", rect: [0.75, 0.75, 0.25, 0.25], source: recording_status }
# Ikke i multiviewen i dag: inngang 5 og 8, og SuperSource. Hvilken inngang som er
# fugleperspektiv og laptop er ikke bekreftet (Q37).
